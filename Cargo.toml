[package]
name = "tm-companion"
version = "0.2.0"
edition = "2021"
description = "Local companion for Tailrmade: forwards API calls, runs AI requests with your own keys, optionally serves Tailrmade"
repository = "https://github.com/PlugAndPlayground/pnp-companion-2"
default-run = "tm-companion"

[dependencies]
axum = "0.7.9"
serde = {version = "1.0.215", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.5"
tokio = { version = "1.41.1", features = ["full"] }
tower-http = {version="0.6.2", features = ["cors"] }
reqwest = { version = "0.12.9", features = ["json", "stream"] }
serde_json = "1.0"
futures-util = "0.3"
mime_guess = "2.0"
xml2json-rs = "1.0.1"
regex = "1.11.1"
base64 = "0.22.1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
dirs = "6"
dotenvy = "0.15.7"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true
